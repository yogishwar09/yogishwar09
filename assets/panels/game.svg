<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-labelledby="t d"><title id="t">Motoverse: a playable motorcycle game that runs on the real contribution calendar</title><desc id="d">Motoverse: a playable motorcycle game that runs on the real contribution calendar</desc><style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><pattern id="carbon" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#080C09"/><rect width="3" height="3" fill="#0C110D"/><rect x="3" y="3" width="3" height="3" fill="#0C110D"/></pattern><linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#121713" stop-opacity=".95"/><stop offset="1" stop-color="#020403" stop-opacity=".95"/></linearGradient><linearGradient id="edge" x1="0" x2="2" gradientUnits="objectBoundingBox" spreadMethod="repeat"><stop offset="0" stop-color="#F044A5" stop-opacity=".9"/><stop offset=".25" stop-color="#F044A5" stop-opacity=".12"/><stop offset=".5" stop-color="#F044A5" stop-opacity=".9"/><stop offset=".75" stop-color="#F044A5" stop-opacity=".12"/><stop offset="1" stop-color="#F044A5" stop-opacity=".9"/><animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="-1 0" dur="7s" repeatCount="indefinite"/></linearGradient><linearGradient id="head" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2FFF4" stop-opacity=".07"/><stop offset="1" stop-color="#F2FFF4" stop-opacity="0"/></linearGradient><linearGradient id="chromeT" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#C9D3CD"/><stop offset=".54" stop-color="#18201B"/><stop offset=".58" stop-color="#F044A5"/><stop offset="1" stop-color="#E4EDE7"/></linearGradient><filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="150" rx="12" fill="url(#carbon)"/><rect width="1200" height="150" rx="12" fill="url(#panel)"/><rect x="1" y="1" width="1198" height="60" rx="11" fill="url(#head)"/><rect x=".75" y=".75" width="1198.5" height="148.5" rx="12" fill="none" stroke="url(#edge)" stroke-width="1.5"/><path d="M0 12 V0 H60" transform="translate(10 10)" fill="none" stroke="#F044A5" stroke-width="2"/><path d="M0 -12 V0 H-60" transform="translate(1190 140)" fill="none" stroke="#F044A5" stroke-width="2"/><rect x="30" y="30" width="38" height="20" fill="none" stroke="#F044A5"/><text x="49" y="44.5" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11" fill="#F044A5">▶</text><text x="82" y="47" font-family="'Sora','Space Grotesk','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-weight="800" font-size="22" letter-spacing="5" fill="#F2FFF4">RIDE THE CONTRIBUTIONS</text><text x="1170" y="45" text-anchor="end" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11" letter-spacing="2" fill="#8FA295">PLAYABLE · WEBGL</text><circle cx="1016.8" cy="41" r="3.5" fill="#FFD43B"><animate attributeName="opacity" values="1;.2;1" dur="1.6s" repeatCount="indefinite"/></circle><text x="30" y="96" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#CFDCD3">53 weeks long, 7 weekday lanes wide. Green days raise the terrain and carry commit beams to collect;</text><text x="30" y="120" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#CFDCD3">month gates are checkpoints. W/↑ throttle · S/↓ brake · A D/← → steer · R restart.</text></svg>
